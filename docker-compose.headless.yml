# Docker Compose for joplin-mcp — headless / server deployment
#
# Use this when Joplin runs headlessly via joplin-terminal-data-api
# (https://github.com/RickoNoNo3/joplin-terminal-data-api) rather than
# the desktop app. The MCP server connects to the Data API over the
# Docker host bridge instead of localhost.
#
# Usage:
#   cp .env.example .env   # then fill in JOPLIN_TOKEN if needed
#   docker compose -f docker-compose.headless.yml up -d
#
# AI clients connect to http://localhost:${MCP_PORT:-8000}/mcp

services:
  joplin-mcp:
    container_name: joplin-mcp
    build: .
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      # joplin-data-api container is on ai_backend network — use its Docker DNS name.
      # The data-api's nginx at :41185 auto-injects the real token, so we connect
      # directly via container name. Token must be non-empty for joplin-mcp validation;
      # the real token is injected by nginx before hitting joplin's Data API.
      - JOPLIN_TOKEN=${JOPLIN_TOKEN:-auto_injected}
      # Connect via Docker service name (joplin-data-api is on ai_backend network).
      - JOPLIN_HOST=${JOPLIN_HOST:-joplin-data-api}
      # Default matches joplin-terminal-data-api's nginx port (41185).
      - JOPLIN_PORT=${JOPLIN_PORT:-41185}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      - QDRANT_BASE_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_MODEL=bge-m3:latest
      - QDRANT_COLLECTION=joplin_notes
    networks:
      - default
      - ai_backend
    # Uncomment to mount a config file for fine-grained tool control:
    # volumes:
    #   - ./joplin-mcp.json:/config/joplin-mcp.json:ro

networks:
  ai_backend:
    external: true
